<svg xmlns="http://www.w3.org/2000/svg" width="860" height="516" viewBox="0 0 860 516" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<style>
:root{--bg:#0d1017;--panel:#12161f;--bd:#262d3b;--tx:#e7ebf2;--mu:#a9b2c2;--su:#8a94a6;--ac:#2dd4bf;--onac:#03201d;--am:#fbbf24;--bull:#34d399;--bear:#fb7185;--chk:#a78bfa;--glow:#2dd4bf;--glowo:.13}
@media (prefers-color-scheme:light){:root{--bg:#ffffff;--panel:#f6f7fa;--bd:#dfe3ea;--tx:#0b1020;--mu:#475166;--su:#586377;--ac:#0f766e;--onac:#ffffff;--am:#b45309;--bull:#047857;--bear:#be123c;--chk:#6d28d9;--glow:#0f766e;--glowo:.07}}
.bg{fill:var(--bg)}.pn{fill:var(--panel)}.bd{stroke:var(--bd);fill:none}.ln{stroke:var(--bd)}
.tx{fill:var(--tx)}.mu{fill:var(--mu)}.su{fill:var(--su)}.ac{fill:var(--ac)}.am{fill:var(--am)}.onac{fill:var(--onac)}
.sa{stroke:var(--ac);fill:none}.sm{stroke:var(--am);fill:none}.fb{fill:var(--bull)}.fr{fill:var(--bear)}.fj{fill:var(--am)}.fc{fill:var(--chk)}
.sk{fill:var(--bd)}
</style>
<defs></defs>
<rect x="1" y="1" width="858" height="514" rx="16" class="bg"/><rect x="1" y="1" width="858" height="514" rx="16" class="bd" stroke-width="1.5"/>
<g transform="translate(22 18) scale(0.923)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><rect class="sa" x="2.5" y="10" width="6.5" height="6.5" rx="1.7"/><rect class="sa" x="8.5" y="5" width="6.5" height="6.5" rx="1.7"/><path class="sm" d="M17.5 3.5h6v18.5l-1.5-1.1-1.5 1.1-1.5-1.1-1.5 1.1z"/></g>
<text x="54" y="36" class="tx" font-size="15" font-weight="650" text-anchor="start" letter-spacing="-0.1">One cycle, end to end</text>
<text x="838" y="36" class="su" font-size="12" font-weight="400" text-anchor="end">Every model call and tool call below leaves a receipt</text>
<rect x="21" y="62" width="182" height="178" rx="12" class="pn"/><rect x="21.5" y="62.5" width="181" height="177" rx="11.5" class="bd" stroke-width="1.2"/>
<circle cx="41" cy="86" r="11" class="ac"/><text x="41" y="90.5" class="onac" font-size="12" font-weight="700" text-anchor="middle">1</text>
<text x="59" y="91" class="tx" font-size="14" font-weight="650" text-anchor="start">Evidence</text>
<text x="37" y="120" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Market data and news:</text>
<text x="37" y="137" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Binance, OKX, GDELT, RSS,</text>
<text x="37" y="154" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Telegram previews, frozen.</text>
<rect x="35" y="209" width="141.1" height="21" rx="10.5" class="ac" style="fill-opacity:.16"/><rect x="35.5" y="209.5" width="140.1" height="20" rx="10" class="sa" stroke-width="1"/><text x="105.6" y="224" class="ac" font-size="11" font-weight="600" text-anchor="middle">Web search and fetch</text>
<rect x="233" y="62" width="182" height="178" rx="12" class="pn"/><rect x="233.5" y="62.5" width="181" height="177" rx="11.5" class="bd" stroke-width="1.2"/>
<circle cx="253" cy="86" r="11" class="ac"/><text x="253" y="90.5" class="onac" font-size="12" font-weight="700" text-anchor="middle">2</text>
<text x="271" y="91" class="tx" font-size="14" font-weight="650" text-anchor="start">Bull and bear</text>
<text x="249" y="120" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Two analysts on two</text>
<text x="249" y="137" class="mu" font-size="11.5" font-weight="400" text-anchor="start">open-weight models argue</text>
<text x="249" y="154" class="mu" font-size="11.5" font-weight="400" text-anchor="start">from the same evidence.</text>
<rect x="247" y="182" width="114.2" height="21" rx="10.5" class="ac" style="fill-opacity:.16"/><rect x="247.5" y="182.5" width="113.2" height="20" rx="10" class="sa" stroke-width="1"/><text x="304.1" y="197" class="ac" font-size="11" font-weight="600" text-anchor="middle">Routing, fallback</text>
<rect x="247" y="209" width="107.0" height="21" rx="10.5" class="ac" style="fill-opacity:.16"/><rect x="247.5" y="209.5" width="106.0" height="20" rx="10" class="sa" stroke-width="1"/><text x="300.5" y="224" class="ac" font-size="11" font-weight="600" text-anchor="middle">Budget per user</text>
<rect x="445" y="62" width="182" height="178" rx="12" class="pn"/><rect x="445.5" y="62.5" width="181" height="177" rx="11.5" class="bd" stroke-width="1.2"/>
<circle cx="465" cy="86" r="11" class="ac"/><text x="465" y="90.5" class="onac" font-size="12" font-weight="700" text-anchor="middle">3</text>
<text x="483" y="91" class="tx" font-size="14" font-weight="650" text-anchor="start">Citation checker</text>
<text x="461" y="120" class="mu" font-size="11.5" font-weight="400" text-anchor="start">A third model re-reads</text>
<text x="461" y="137" class="mu" font-size="11.5" font-weight="400" text-anchor="start">each claim against the</text>
<text x="461" y="154" class="mu" font-size="11.5" font-weight="400" text-anchor="start">evidence it cites.</text>
<rect x="459" y="209" width="114.2" height="21" rx="10.5" class="ac" style="fill-opacity:.16"/><rect x="459.5" y="209.5" width="113.2" height="20" rx="10" class="sa" stroke-width="1"/><text x="516.1" y="224" class="ac" font-size="11" font-weight="600" text-anchor="middle">Routing, fallback</text>
<rect x="657" y="62" width="182" height="178" rx="12" class="pn"/><rect x="657.5" y="62.5" width="181" height="177" rx="11.5" class="bd" stroke-width="1.2"/>
<circle cx="677" cy="86" r="11" class="ac"/><text x="677" y="90.5" class="onac" font-size="12" font-weight="700" text-anchor="middle">4</text>
<text x="695" y="91" class="tx" font-size="14" font-weight="650" text-anchor="start">Judge</text>
<text x="673" y="120" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Weighs only the claims</text>
<text x="673" y="137" class="mu" font-size="11.5" font-weight="400" text-anchor="start">that were validated.</text>
<text x="673" y="154" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Guardrails: NOT PROVEN.</text>
<rect x="671" y="182" width="100.0" height="21" rx="10.5" class="ac" style="fill-opacity:.16"/><rect x="671.5" y="182.5" width="99.0" height="20" rx="10" class="sa" stroke-width="1"/><text x="721.0" y="197" class="ac" font-size="11" font-weight="600" text-anchor="middle">Routing policy</text>
<rect x="671" y="209" width="64.5" height="21" rx="10.5" class="ac" style="fill-opacity:.16"/><rect x="671.5" y="209.5" width="63.5" height="20" rx="10" class="sa" stroke-width="1"/><text x="703.3" y="224" class="ac" font-size="11" font-weight="600" text-anchor="middle">Budgets</text>
<rect x="21" y="290" width="182" height="178" rx="12" class="pn"/><rect x="21.5" y="290.5" width="181" height="177" rx="11.5" class="bd" stroke-width="1.2"/>
<circle cx="41" cy="314" r="11" class="ac"/><text x="41" y="318.5" class="onac" font-size="12" font-weight="700" text-anchor="middle">5</text>
<text x="59" y="319" class="tx" font-size="14" font-weight="650" text-anchor="start">Rules engine</text>
<text x="37" y="348" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Deterministic code turns</text>
<text x="37" y="365" class="mu" font-size="11.5" font-weight="400" text-anchor="start">the judge&#x27;s lean into a</text>
<text x="37" y="382" class="mu" font-size="11.5" font-weight="400" text-anchor="start">paper-trade verdict.</text>
<rect x="35" y="437" width="128.1" height="21" rx="10.5" class="bd" stroke-width="1" stroke-dasharray="3 3"/><text x="99.0" y="452" class="su" font-size="11" font-weight="500" text-anchor="middle">Our code, no model</text>
<rect x="233" y="290" width="182" height="178" rx="12" class="pn"/><rect x="233.5" y="290.5" width="181" height="177" rx="11.5" class="bd" stroke-width="1.2"/>
<circle cx="253" cy="314" r="11" class="ac"/><text x="253" y="318.5" class="onac" font-size="12" font-weight="700" text-anchor="middle">6</text>
<text x="271" y="319" class="tx" font-size="14" font-weight="650" text-anchor="start">Re-derive and check</text>
<text x="249" y="348" class="mu" font-size="11.5" font-weight="400" text-anchor="start">The verdict is re-run in a</text>
<text x="249" y="365" class="mu" font-size="11.5" font-weight="400" text-anchor="start">sandbox, and prices are</text>
<text x="249" y="382" class="mu" font-size="11.5" font-weight="400" text-anchor="start">read through MCP.</text>
<rect x="247" y="410" width="106.7" height="21" rx="10.5" class="ac" style="fill-opacity:.16"/><rect x="247.5" y="410.5" width="105.7" height="20" rx="10" class="sa" stroke-width="1"/><text x="300.4" y="425" class="ac" font-size="11" font-weight="600" text-anchor="middle">Code execution</text>
<rect x="247" y="437" width="44.4" height="21" rx="10.5" class="ac" style="fill-opacity:.16"/><rect x="247.5" y="437.5" width="43.4" height="20" rx="10" class="sa" stroke-width="1"/><text x="269.2" y="452" class="ac" font-size="11" font-weight="600" text-anchor="middle">MCP</text>
<rect x="445" y="290" width="182" height="178" rx="12" class="pn"/><rect x="445.5" y="290.5" width="181" height="177" rx="11.5" class="bd" stroke-width="1.2"/>
<circle cx="465" cy="314" r="11" class="ac"/><text x="465" y="318.5" class="onac" font-size="12" font-weight="700" text-anchor="middle">7</text>
<text x="483" y="319" class="tx" font-size="14" font-weight="650" text-anchor="start">Sealed dossier</text>
<text x="461" y="348" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Evidence, verdict and a</text>
<text x="461" y="365" class="mu" font-size="11.5" font-weight="400" text-anchor="start">receipt per call, hashed</text>
<text x="461" y="382" class="mu" font-size="11.5" font-weight="400" text-anchor="start">into the ledger chain.</text>
<rect x="459" y="437" width="149.2" height="21" rx="10.5" class="bd" stroke-width="1" stroke-dasharray="3 3"/><text x="533.6" y="452" class="su" font-size="11" font-weight="500" text-anchor="middle">Hash chain, replayable</text>
<rect x="657" y="290" width="182" height="178" rx="12" class="pn"/><rect x="657.5" y="290.5" width="181" height="177" rx="11.5" class="bd" stroke-width="1.2"/>
<circle cx="677" cy="314" r="11" class="ac"/><text x="677" y="318.5" class="onac" font-size="12" font-weight="700" text-anchor="middle">8</text>
<text x="695" y="319" class="tx" font-size="14" font-weight="650" text-anchor="start">Outside witnesses</text>
<text x="673" y="348" class="mu" font-size="11.5" font-weight="400" text-anchor="start">OpenTimestamps each cycle.</text>
<text x="673" y="365" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Sigstore head lookup.</text>
<text x="673" y="382" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Git history.</text>
<rect x="671" y="437" width="89.6" height="21" rx="10.5" class="bd" stroke-width="1" stroke-dasharray="3 3"/><text x="715.8" y="452" class="su" font-size="11" font-weight="500" text-anchor="middle">Third parties</text>
