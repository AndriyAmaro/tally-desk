<rect x="22" y="483" width="16" height="16" rx="8" class="ac" style="fill-opacity:.16"/><rect x="22.5" y="483.5" width="15" height="15" rx="7.5" class="sa" stroke-width="1"/><text x="46" y="496" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Goes through the Otari gateway, and the feature it exercises</text><rect x="438" y="483" width="16" height="16" rx="8" class="bd" stroke-width="1" stroke-dasharray="3 3"/><text x="462" y="496" class="mu" font-size="11.5" font-weight="400" text-anchor="start">Runs in our own code or outside parties, not through Otari</text>
