<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<style>
:root{--bg:#0d1017;--panel:#12161f;--bd:#262d3b;--tx:#e7ebf2;--mu:#a9b2c2;--su:#8a94a6;--ac:#2dd4bf;--onac:#03201d;--am:#fbbf24;--bull:#34d399;--bear:#fb7185;--chk:#a78bfa;--glow:#2dd4bf;--glowo:.13}
@media (prefers-color-scheme:light){:root{--bg:#ffffff;--panel:#f6f7fa;--bd:#dfe3ea;--tx:#0b1020;--mu:#475166;--su:#586377;--ac:#0f766e;--onac:#ffffff;--am:#b45309;--bull:#047857;--bear:#be123c;--chk:#6d28d9;--glow:#0f766e;--glowo:.07}}
.bg{fill:var(--bg)}.pn{fill:var(--panel)}.bd{stroke:var(--bd);fill:none}.ln{stroke:var(--bd)}
.tx{fill:var(--tx)}.mu{fill:var(--mu)}.su{fill:var(--su)}.ac{fill:var(--ac)}.am{fill:var(--am)}.onac{fill:var(--onac)}
.sa{stroke:var(--ac);fill:none}.sm{stroke:var(--am);fill:none}.fb{fill:var(--bull)}.fr{fill:var(--bear)}.fj{fill:var(--am)}.fc{fill:var(--chk)}
.sk{fill:var(--bd)}
</style>
<defs><radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox"><stop offset="0" style="stop-color:var(--glow);stop-opacity:var(--glowo)"/><stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/></radialGradient><clipPath id="clip"><rect x="1" y="1" width="858" height="248" rx="16"/></clipPath></defs>
<rect x="1" y="1" width="858" height="248" rx="16" class="bg"/>
<g clip-path="url(#clip)"><ellipse cx="120" cy="20" rx="420" ry="260" fill="url(#glow)"/></g>
<rect x="1" y="1" width="858" height="248" rx="16" class="bd" stroke-width="1.5"/>
<g transform="translate(38 30) scale(1.077)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><rect class="sa" x="2.5" y="10" width="6.5" height="6.5" rx="1.7"/><rect class="sa" x="8.5" y="5" width="6.5" height="6.5" rx="1.7"/><path class="sm" d="M17.5 3.5h6v18.5l-1.5-1.1-1.5 1.1-1.5-1.1-1.5 1.1z"/></g>
<text x="76" y="50" class="mu" font-size="15" font-weight="600" text-anchor="start" letter-spacing="-0.1">Verdict Desk on Otari</text>
<text x="40" y="112" class="tx" font-size="38" font-weight="650" text-anchor="start" letter-spacing="-1.2">Every model call, on the record.</text>
<text x="40" y="148" class="mu" font-size="15" font-weight="400" text-anchor="start">A paper-trading agent. Every call goes through the Otari gateway,</text>
<text x="40" y="169" class="mu" font-size="15" font-weight="400" text-anchor="start">on open-weight models, and leaves a receipt anyone can re-verify offline.</text>
<rect x="40.0" y="188" width="129.8" height="26" rx="13" class="pn"/><rect x="40.5" y="188.5" width="128.8" height="25" rx="12.5" class="bd"/><text x="104.9" y="205.5" class="mu" font-size="12" font-weight="500" text-anchor="middle">Open-weight only</text><rect x="177.8" y="188" width="123.2" height="26" rx="13" class="pn"/><rect x="178.3" y="188.5" width="122.2" height="25" rx="12.5" class="bd"/><text x="239.5" y="205.5" class="mu" font-size="12" font-weight="500" text-anchor="middle">A receipt per call</text><rect x="309.1" y="188" width="147.8" height="26" rx="13" class="pn"/><rect x="309.6" y="188.5" width="146.8" height="25" rx="12.5" class="bd"/><text x="383.0" y="205.5" class="mu" font-size="12" font-weight="500" text-anchor="middle">Hash-chained ledger</text><rect x="464.9" y="188" width="126.5" height="26" rx="13" class="pn"/><rect x="465.4" y="188.5" width="125.5" height="25" rx="12.5" class="bd"/><text x="528.2" y="205.5" class="mu" font-size="12" font-weight="500" text-anchor="middle">Paper trades only</text>
<path d="M628 28 h196 v190 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 z" class="pn"/><path d="M628 28 h196 v190 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 z" class="bd" stroke-width="1.2"/><text x="646" y="58" class="mu" font-size="12" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">receipt</text><circle cx="650" cy="80" r="4.5" class="fb"/><text x="662" y="84" class="tx" font-size="11.5" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bull</text><rect x="728" y="74" width="58" height="4" rx="2" class="sk"/><rect x="728" y="82" width="40" height="4" rx="2" class="sk"/><circle cx="650" cy="111" r="4.5" class="fr"/><text x="662" y="115" class="tx" font-size="11.5" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bear</text><rect x="728" y="105" width="42" height="4" rx="2" class="sk"/><rect x="728" y="113" width="54" height="4" rx="2" class="sk"/><circle cx="650" cy="142" r="4.5" class="fj"/><text x="662" y="146" class="tx" font-size="11.5" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">judge</text><rect x="728" y="136" width="66" height="4" rx="2" class="sk"/><rect x="728" y="144" width="30" height="4" rx="2" class="sk"/><circle cx="650" cy="173" r="4.5" class="fc"/><text x="662" y="177" class="tx" font-size="11.5" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">checker</text><rect x="728" y="167" width="50" height="4" rx="2" class="sk"/><rect x="728" y="175" width="44" height="4" rx="2" class="sk"/><line x1="646" y1="184" x2="806" y2="184" class="ln" stroke-dasharray="3 4"/><rect x="646" y="188" width="160" height="5" rx="2.5" class="sk"/>
</svg>
