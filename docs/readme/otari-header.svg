<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<style>
:root{--bg:#0d1017;--panel:#12161f;--bd:#262d3b;--tx:#e7ebf2;--mu:#a9b2c2;--su:#8a94a6;--ac:#2dd4bf;--onac:#03201d;--am:#fbbf24;--bull:#34d399;--bear:#fb7185;--chk:#a78bfa;--glow:#2dd4bf;--glowo:.13}
@media (prefers-color-scheme:light){:root{--bg:#ffffff;--panel:#f6f7fa;--bd:#dfe3ea;--tx:#0b1020;--mu:#475166;--su:#586377;--ac:#0f766e;--onac:#ffffff;--am:#b45309;--bull:#047857;--bear:#be123c;--chk:#6d28d9;--glow:#0f766e;--glowo:.07}}
.bg{fill:var(--bg)}.pn{fill:var(--panel)}.bd{stroke:var(--bd);fill:none}.ln{stroke:var(--bd)}
.tx{fill:var(--tx)}.mu{fill:var(--mu)}.su{fill:var(--su)}.ac{fill:var(--ac)}.am{fill:var(--am)}.onac{fill:var(--onac)}
.sa{stroke:var(--ac);fill:none}.sm{stroke:var(--am);fill:none}.fb{fill:var(--bull)}.fr{fill:var(--bear)}.fj{fill:var(--am)}.fc{fill:var(--chk)}
.sk{fill:var(--bd)}
</style>
<defs><radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox"><stop offset="0" style="stop-color:var(--glow);stop-opacity:var(--glowo)"/><stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/></radialGradient><radialGradient id="g2" cx="1" cy="1" r="1" gradientUnits="objectBoundingBox"><stop offset="0" style="stop-color:var(--am);stop-opacity:.10"/><stop offset="1" style="stop-color:var(--am);stop-opacity:0"/></radialGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--ac)"/><stop offset="1" style="stop-color:var(--am)"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" style="fill:var(--bd)"/></pattern><clipPath id="clip"><rect x="1" y="1" width="858" height="298" rx="18"/></clipPath></defs>
<rect x="1" y="1" width="858" height="298" rx="18" class="bg"/>
<g clip-path="url(#clip)"><rect width="860" height="300" fill="url(#dots)" opacity=".55"/><ellipse cx="140" cy="10" rx="460" ry="280" fill="url(#g1)"/><ellipse cx="780" cy="300" rx="380" ry="220" fill="url(#g2)"/><rect x="0" y="0" width="860" height="4" fill="url(#edge)"/></g>
<rect x="1" y="1" width="858" height="298" rx="18" class="bd" stroke-width="1.5"/>
<g transform="translate(40 34) scale(1.154)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><rect class="sa" x="2.5" y="10" width="6.5" height="6.5" rx="1.7"/><rect class="sa" x="8.5" y="5" width="6.5" height="6.5" rx="1.7"/><path class="sm" d="M17.5 3.5h6v18.5l-1.5-1.1-1.5 1.1-1.5-1.1-1.5 1.1z"/></g>
<text x="82" y="56" class="mu" font-size="15" font-weight="600" text-anchor="start" letter-spacing="-0.1">Tally Desk on Otari</text>
<text x="40" y="122" class="tx" font-size="46" font-weight="700" text-anchor="start" letter-spacing="-1.6">Every model call,</text>
<text x="40" y="172" class="ac" font-size="46" font-weight="700" text-anchor="start" letter-spacing="-1.6">on the record.</text>
<text x="40" y="204" class="mu" font-size="14.5" font-weight="400" text-anchor="start">A paper-trading agent on the Otari gateway and open-weight models.</text>
<text x="40" y="224" class="mu" font-size="14.5" font-weight="400" text-anchor="start">Each call leaves a receipt anyone can re-verify offline.</text>
<rect x="40.0" y="238" width="129.8" height="26" rx="13" class="pn"/><rect x="40.5" y="238.5" width="128.8" height="25" rx="12.5" class="bd"/><text x="104.9" y="255.5" class="mu" font-size="12" font-weight="500" text-anchor="middle">Open-weight only</text><rect x="177.8" y="238" width="123.2" height="26" rx="13" class="pn"/><rect x="178.3" y="238.5" width="122.2" height="25" rx="12.5" class="bd"/><text x="239.5" y="255.5" class="mu" font-size="12" font-weight="500" text-anchor="middle">A receipt per call</text><rect x="309.1" y="238" width="147.8" height="26" rx="13" class="pn"/><rect x="309.6" y="238.5" width="146.8" height="25" rx="12.5" class="bd"/><text x="383.0" y="255.5" class="mu" font-size="12" font-weight="500" text-anchor="middle">Hash-chained ledger</text><rect x="464.9" y="238" width="126.5" height="26" rx="13" class="pn"/><rect x="465.4" y="238.5" width="125.5" height="25" rx="12.5" class="bd"/><text x="528.2" y="255.5" class="mu" font-size="12" font-weight="500" text-anchor="middle">Paper trades only</text>
<path d="M618 46 h196 v190 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 z" class="pn"/><path d="M618 46 h196 v190 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 l-14.00 -7 l-14.00 7 z" class="bd" stroke-width="1.2"/><text x="636" y="76" class="mu" font-size="12" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">receipt</text><circle cx="640" cy="98" r="4.5" class="fb"/><text x="652" y="102" class="tx" font-size="11.5" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bull</text><rect x="718" y="92" width="58" height="4" rx="2" class="sk"/><rect x="718" y="100" width="40" height="4" rx="2" class="sk"/><circle cx="640" cy="129" r="4.5" class="fr"/><text x="652" y="133" class="tx" font-size="11.5" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bear</text><rect x="718" y="123" width="42" height="4" rx="2" class="sk"/><rect x="718" y="131" width="54" height="4" rx="2" class="sk"/><circle cx="640" cy="160" r="4.5" class="fj"/><text x="652" y="164" class="tx" font-size="11.5" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">judge</text><rect x="718" y="154" width="66" height="4" rx="2" class="sk"/><rect x="718" y="162" width="30" height="4" rx="2" class="sk"/><circle cx="640" cy="191" r="4.5" class="fc"/><text x="652" y="195" class="tx" font-size="11.5" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">checker</text><rect x="718" y="185" width="50" height="4" rx="2" class="sk"/><rect x="718" y="193" width="44" height="4" rx="2" class="sk"/><line x1="636" y1="202" x2="796" y2="202" class="ln" stroke-dasharray="3 4"/><rect x="636" y="206" width="160" height="5" rx="2.5" class="sk"/>
</svg>
